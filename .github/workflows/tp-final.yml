name: tp-final

on:
  push:
    paths: ['tp-final/**', '.github/workflows/tp-final.yml']
  pull_request:
    paths: ['tp-final/**', '.github/workflows/tp-final.yml']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tp-final/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulso
          POSTGRES_PASSWORD: pulso
          POSTGRES_DB: pulso
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pulso" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://pulso:pulso@localhost:5432/pulso

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tp-final/frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulso
          POSTGRES_PASSWORD: pulso
          POSTGRES_DB: pulso
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pulso" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tp-final/frontend/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date
        run: npm run gen:api && git diff --exit-code -- openapi.json src/api/schema.d.ts
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
