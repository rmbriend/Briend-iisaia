  <style>

</main>

<script>

const alertaTrayectoria = document.getElementById("alerta-trayectoria");
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const telefonoElement = document.getElementById("telefono");
const mensajeElement = document.getElementById("mensaje");

let width;
let height;

function resizeCanvas() {

  const rect = canvas.getBoundingClientRect();

  width = rect.width;
  height = rect.height;

  canvas.width = width * devicePixelRatio;
  canvas.height = height * devicePixelRatio;

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );

}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();


// --------------------------------------------------
// CONFIGURACIÓN
// --------------------------------------------------

const gravity = 162; // gravedad lunar escalada para la simulación

const slingshot = {
  x: width - 170,
  y: 100
};

const bird = {

  radius: 14,

  x: slingshot.x,
  y: slingshot.y,

  vx: 0,
  vy: 0,

  dragging: false,
  flying: false
};

let telefono = "";


// --------------------------------------------------
// POSICIONES DE LOS NÚMEROS
// --------------------------------------------------

function obtenerCajasNumeros() {

  const mainRect =
    document.querySelector("main").getBoundingClientRect();

  const elementos =
    document.querySelectorAll(".numero");

  return [...elementos].map(elemento => {

    const r = elemento.getBoundingClientRect();

    return {

      numero: elemento.dataset.numero,

      x: r.left - mainRect.left,
      y: r.top - mainRect.top,

      width: r.width,
      height: r.height
    };

  });

}


// --------------------------------------------------
// MOUSE / POINTER
// --------------------------------------------------

function posicionPointer(event) {

  const rect = canvas.getBoundingClientRect();

  return {

    x: event.clientX - rect.left,
    y: event.clientY - rect.top

  };

}


canvas.addEventListener("pointerdown", event => {

  if (bird.flying) return;

  const mouse = posicionPointer(event);

  const dx = mouse.x - bird.x;
  const dy = mouse.y - bird.y;

  const distancia = Math.sqrt(dx * dx + dy * dy);

  if (distancia <= bird.radius * 2) {

    bird.dragging = true;

    canvas.classList.add("dragging");

    canvas.setPointerCapture(event.pointerId);

  }

});


canvas.addEventListener("pointermove", event => {

  if (!bird.dragging) return;

  const mouse = posicionPointer(event);

  let dx = mouse.x - slingshot.x;
  let dy = mouse.y - slingshot.y;

  // El pájaro solo se puede arrastrar hacia la derecha
  dx = Math.max(dx, 0);

  const maxDistance = 130;

  const distance =
    Math.sqrt(dx * dx + dy * dy);

  if (distance > maxDistance) {

    dx = dx / distance * maxDistance;
    dy = dy / distance * maxDistance;

  }

  bird.x = slingshot.x + dx;
  bird.y = slingshot.y + dy;

});


canvas.addEventListener("pointerup", event => {

  if (!bird.dragging) return;

  bird.dragging = false;

  canvas.classList.remove("dragging");

  // Distancia respecto de la honda

const dx = slingshot.x - bird.x;
const dy = slingshot.y - bird.y;

const power = 6;

bird.vx = dx * power;
bird.vy = dy * power;

bird.flying = true;

});


// --------------------------------------------------
// COLISIONES
// --------------------------------------------------

function colisionCirculoRectangulo(circle, rect) {

  const closestX =
    Math.max(
      rect.x,
      Math.min(circle.x, rect.x + rect.width)
    );

  const closestY =
    Math.max(
      rect.y,
      Math.min(circle.y, rect.y + rect.height)
    );

  const dx =
    circle.x - closestX;

  const dy =
    circle.y - closestY;

  return (
    dx * dx + dy * dy
    <
    circle.radius * circle.radius
  );

}


// --------------------------------------------------
// REGISTRAR NÚMERO
// --------------------------------------------------

function registrarNumero(numero) {

  telefono += numero;

  let telefonoFormateado = telefono;

  // Agregar guion después del cuarto dígito
  if (telefono.length > 4) {
    telefonoFormateado =
      telefono.slice(0, 4) + "-" + telefono.slice(4);
  }

  telefonoElement.textContent = telefonoFormateado;
  mensajeElement.textContent = "";

  // Después del cuarto número
  if (telefono.length === 4) {

    alertaTrayectoria.textContent =
      "desactivando visualización de trayectoria...";

    alertaTrayectoria.style.color = "red";
    alertaTrayectoria.style.display = "block";

    setTimeout(() => {
      alertaTrayectoria.style.display = "none";
    }, 3000);
  }

  // Al completar los 8 números
  if (telefono.length === 8) {

    alertaTrayectoria.textContent =
      "Número telefónico registrado con éxito";

    alertaTrayectoria.style.color = "white";
    alertaTrayectoria.style.display = "block";

    // Esperar 3 segundos y reiniciar
    setTimeout(() => {

      alertaTrayectoria.style.display = "none";

      telefono = "";
      telefonoElement.textContent = "";

      mensajeElement.textContent =
        "Arrastre el Angry Bird y suéltelo.";

      resetBird();

    }, 3000);
  }

  resetBird();
}


// --------------------------------------------------
// RESET
// --------------------------------------------------

function resetBird() {

  bird.x = slingshot.x;
  bird.y = slingshot.y;

  bird.vx = 0;
  bird.vy = 0;

  bird.flying = false;

}


// --------------------------------------------------
// FÍSICA
// --------------------------------------------------

let previousTime = performance.now();

function actualizar(time) {

  let dt =
    (time - previousTime) / 1000;

  previousTime = time;

  dt = Math.min(dt, 0.03);

  if (bird.flying) {

    bird.vy += gravity * dt;

    bird.x += bird.vx * dt;
    bird.y += bird.vy * dt;


    const cajas =
      obtenerCajasNumeros();


    for (const caja of cajas) {

      if (
        colisionCirculoRectangulo(
          bird,
          caja
        )
      ) {

        registrarNumero(
          caja.numero
        );

        break;

      }

    }


    // Reiniciar si sale de pantalla

    if (
      bird.x > width + 100 ||
      bird.y > height + 100 ||
      bird.x < -100
    ) {

      resetBird();

    }

  }

}


// --------------------------------------------------
// DIBUJAR HONDA
// --------------------------------------------------

function dibujarSlingshot() {

  ctx.lineWidth = 8;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#8b4513";

  ctx.beginPath();

  ctx.moveTo(
    slingshot.x - 10,
    slingshot.y + 15
  );

  ctx.lineTo(
    slingshot.x - 20,
    slingshot.y + 80
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    slingshot.x + 10,
    slingshot.y + 15
  );

  ctx.lineTo(
    slingshot.x + 20,
    slingshot.y + 80
  );

  ctx.stroke();


  if (bird.dragging) {

    ctx.lineWidth = 3;
    ctx.strokeStyle = "#dddddd";

    ctx.beginPath();

    ctx.moveTo(
      slingshot.x - 10,
      slingshot.y
    );

    ctx.lineTo(
      bird.x,
      bird.y
    );

    ctx.lineTo(
      slingshot.x + 10,
      slingshot.y
    );

    ctx.stroke();
  }
}


// --------------------------------------------------
// DIBUJAR PÁJARO
// --------------------------------------------------

function dibujarBird() {

  ctx.save();

  // cuerpo

  ctx.fillStyle = "#d62828";

  ctx.beginPath();

  ctx.arc(
    bird.x,
    bird.y,
    bird.radius,
    0,
    Math.PI * 2
  );

  ctx.fill();


  // ojo

  ctx.fillStyle = "#ffffff";

  ctx.beginPath();

  ctx.arc(
    bird.x + 5,
    bird.y - 5,
    4,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.fillStyle = "#000000";

  ctx.beginPath();

  ctx.arc(
    bird.x + 6,
    bird.y - 5,
    2,
    0,
    Math.PI * 2
  );

  ctx.fill();


  // pico

  ctx.fillStyle = "#ffb703";

  ctx.beginPath();

  ctx.moveTo(
    bird.x + 12,
    bird.y
  );

  ctx.lineTo(
    bird.x + 23,
    bird.y + 4
  );

  ctx.lineTo(
    bird.x + 12,
    bird.y + 8
  );

  ctx.fill();

  ctx.restore();

}


// --------------------------------------------------
// TRAYECTORIA PREDICHA
// --------------------------------------------------

function dibujarTrayectoria() {

  // A partir del quinto número, ocultar trayectoria
  if (telefono.length >= 4) return;

  if (!bird.dragging) return;

  const dx = slingshot.x - bird.x;
  const dy = slingshot.y - bird.y;

  const vx = dx * 6;
  const vy = dy * 6;

  ctx.fillStyle = "rgba(255,255,255,0.5)";

  for (let t = 0.1; t < 1.5; t += 0.1) {

    const x =
      slingshot.x +
      vx * t;

    const y =
      slingshot.y +
      vy * t +
      0.5 * gravity * t * t;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      2,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }
}


// --------------------------------------------------
// LOOP
// --------------------------------------------------

function draw(time) {

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  actualizar(time);

  dibujarSlingshot();

  dibujarTrayectoria();

  dibujarBird();

  requestAnimationFrame(draw);

}

requestAnimationFrame(draw);

</script>

</body>
</html>
